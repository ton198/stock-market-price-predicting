[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nasdaq-forecasting-trading"
version = "0.1.0"
description = "Leakage-aware data and evaluation utilities for a NASDAQ forecasting project"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["quant_pipeline*"]
